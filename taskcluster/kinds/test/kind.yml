---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.matrix
    - taskgraph.transforms.run:transforms
    - taskgraph.transforms.task:transforms

task-defaults:
    attributes:
        retrigger: true
    worker-type: linux
    worker:
        docker-image: {in-tree: python}
        max-run-time: 3600
    run:
        using: run-task
        cwd: '{checkout}'
        use-caches: [checkout, uv]

tasks:
    unit:
        matrix:
            set-name: "unit-py{matrix[python]}"
            substitution-fields: [description, run.command, worker, attributes]
            python: ["3.14", "3.13", "3.12", "3.11", "3.10"]
        description: "Run unit tests with py{matrix[python]}"
        worker:
            env:
                UV_PYTHON: "{matrix[python]}"
        run:
            command: >-
                uv run pytest

    renovate-config:
        description: "Validate the shared renovate template using renovate-config-validator"
        worker:
            docker-image: {in-tree: node}
        run:
            use-caches: [checkout]
            command: >-
                renovate-config-validator renovate-preset.json5
